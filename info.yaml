# ======================================================
# Project metadata (used for documentation / review)
# ======================================================

project:
  title: "Low-Power 12-Bit First-Order Delta-Sigma ADC"
  team: "ARNSChips"
  discord: "mycompanyios"
  description: "A low-power 12-bit first-order delta-sigma ADC in GF180MCU-D with an analog modulator, CIC decimation filter, and 12-bit PISO serial output."
  lvs_config: "lvs_config.json"
  gf_def_ready: false
  ws_def_ready: false
  drc_ready: true
  lvs_ready: false

pins:
  # Analog
  - name: AVSS
    io_type: ground
  - name: Vbiasn
    io_type: analog
    secondary_esd: true
  - name: Vbiasp
    io_type: analog
    secondary_esd: true
  - name: VREFN
    io_type: analog
    secondary_esd: true
  - name: VREFP
    io_type: analog
    secondary_esd: true
  - name: Vin-
    io_type: analog
    secondary_esd: true
  - name: Vin+
    io_type: analog
    secondary_esd: true
  - name: AVDD
    io_type: power
    
  # Digital
  - name: DVSS
    io_type: ground
  - name: rst
    io_type: input_cmos
  - name: in_clk
    io_type: input_schmitt
  - name: serial_out
    io_type: bidirectional
  - name: DVDD
    io_type: power